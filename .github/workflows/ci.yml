# Independent reference implementation for the Sedem Ads showcase. Not production source.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history scan needs every commit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Offline example (no network, no credentials)
        run: node examples/quickstart.mjs
      - name: Samples are reproducible
        run: |
          node examples/generate-samples.mjs
          git diff --exit-code -- examples/samples
      - name: Privacy scan script tests
        run: npm run test:scripts
      - name: Privacy scan, working tree
        run: npm run privacy-scan
      - name: Privacy scan, git history
        run: npm run privacy-scan:history

  secrets:
    # gitleaks is run from a pinned release binary, verified against its published checksum.
    # The gitleaks GitHub Action is deliberately not used.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --no-banner --redact'
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --no-banner --redact'
